<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
	/* Stemic Cloud portal. One document sheet per page on security-paper grey; the seal is the only ornament. */
	.sc {
		--paper: #f3f5f2; --sheet: #ffffff; --ink: #13233f; --ink-2: #56637a; --rule: #d3dbd6; --rule-2: #e7ece9;
		--seal: #1e6b57; --seal-wash: #e2eee8; --amber: #94590a; --amber-wash: #f7ead4; --red: #a8261b;
		--red-wash: #f6e0dc; --focus: #2f6fdb; --on-ink: #f3f5f2; --bar: #13233f; --on-bar: #f3f5f2;
		--f-1: .8rem; --f0: .9375rem; --f1: 1.17rem; --f2: 1.46rem; --f3: 1.83rem; --f4: 2.29rem;
		font-family: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif; font-size: var(--f0); line-height: 1.55;
		color: var(--ink); background: var(--paper); min-height: 100vh;
		-webkit-font-smoothing: antialiased;
	}
	@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sc {
		--paper: #0d1626; --sheet: #132036; --ink: #e8edf5; --ink-2: #9aa8bf; --rule: #29374f; --rule-2: #1d2a40;
		--seal: #62c4a5; --seal-wash: #133229; --amber: #e2a94f; --amber-wash: #33260f; --red: #ef8274;
		--red-wash: #3a1b17; --focus: #7aa7ff; --on-ink: #0d1626; --bar: #060d19; --on-bar: #e8edf5; } }
	:root[data-theme="dark"] .sc {
		--paper: #0d1626; --sheet: #132036; --ink: #e8edf5; --ink-2: #9aa8bf; --rule: #29374f; --rule-2: #1d2a40;
		--seal: #62c4a5; --seal-wash: #133229; --amber: #e2a94f; --amber-wash: #33260f; --red: #ef8274;
		--red-wash: #3a1b17; --focus: #7aa7ff; --on-ink: #0d1626; --bar: #060d19; --on-bar: #e8edf5; }
	.sc *, .sc *::before, .sc *::after { box-sizing: border-box; }
	.sc a { color: inherit; text-underline-offset: 3px; }
	.sc :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
	.sc p { margin: 0 0 .8em; max-width: 68ch; }

	/* frame: top bar, folder tabs, the sheet */
	.sc-top { background: var(--bar); color: var(--on-bar); }
	.sc-top-in { max-width: 1120px; margin: 0 auto; padding: 14px 24px 0; }
	.sc-top-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
	.sc-mark { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: var(--f1);
		letter-spacing: -.01em; }
	.sc-mark svg { width: 26px; height: 26px; }
	.sc-mark small { font-weight: 500; opacity: .7; font-size: var(--f-1); letter-spacing: 0; }
	.sc-who { display: flex; align-items: center; gap: 18px; font-size: var(--f-1); flex-wrap: wrap; }
	.sc-who select { background: transparent; color: inherit; border: 1px solid rgba(243, 245, 242, .35); border-radius: 6px;
		padding: 4px 8px; font: inherit; }
	.sc-who select option { color: #13233f; }
	.sc-who a { opacity: .85; }
	.sc-tabs { display: flex; gap: 2px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
	.sc-tabs a { padding: 10px 16px 11px; text-decoration: none; font-weight: 600; font-size: var(--f-1); white-space: nowrap;
		border-radius: 8px 8px 0 0; opacity: .78; }
	.sc-tabs a:hover { opacity: 1; background: rgba(243, 245, 242, .08); }
	.sc-tabs a.on { background: var(--paper); color: var(--ink); opacity: 1; }
	.sc-page { max-width: 1120px; margin: 0 auto; padding: 28px 24px 72px; }
	.sc-sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 36px 40px 40px; }
	@media (max-width: 720px) { .sc-top-in, .sc-page { padding-left: 16px; padding-right: 16px; }
		.sc-sheet { padding: 22px 18px 26px; } }

	/* type */
	.sc h1 { font-size: var(--f4); line-height: 1.1; font-weight: 800; letter-spacing: -.025em; margin: 0 0 .3em; }
	.sc h2 { font-size: var(--f1); line-height: 1.3; font-weight: 700; letter-spacing: -.01em; margin: 0 0 .7em; }
	.sc h3 { font-size: var(--f0); font-weight: 700; margin: 0 0 .4em; }
	.sc-lede { color: var(--ink-2); font-size: var(--f1); line-height: 1.45; margin: 0 0 2.2em; max-width: 60ch; }
	.sc-quiet { color: var(--ink-2); }
	.sc-small { font-size: var(--f-1); }
	.sc-section { margin-top: 40px; }
	.sc-sheet section > h2 { padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
	.sc-cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 48px; }
	@media (max-width: 860px) { .sc-cols { grid-template-columns: 1fr; gap: 40px; } }

	/* the certificate: the seal and what it certifies */
	.sc-cert { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 32px; align-items: center;
		padding: 26px 30px; border: 1px solid var(--rule); outline: 1px solid var(--rule); outline-offset: -7px;
		border-radius: 2px; background: linear-gradient(var(--sheet), var(--sheet)) padding-box; }
	@media (max-width: 620px) { .sc-cert { grid-template-columns: 1fr; justify-items: start; gap: 16px; padding: 22px; } }
	.sc-seal { position: relative; width: 168px; height: 168px; color: var(--seal); }
	.sc-seal svg { width: 100%; height: 100%; display: block; }
	.sc-seal path { fill: none; stroke: currentColor; }
	.sc-seal .w { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
	.sc-seal .w span { background: var(--sheet); padding: 6px 10px; border-radius: 999px; font-weight: 800; font-size: var(--f-1);
		line-height: 1.2; color: currentColor; box-shadow: 0 0 0 1px currentColor; }
	.sc-seal.working { color: var(--ink-2); } .sc-seal.held { color: var(--amber); } .sc-seal.stopped { color: var(--red); }
	.sc-seal.working svg { animation: sc-turn 40s linear infinite; }
	@keyframes sc-turn { to { transform: rotate(360deg); } }
	@media (prefers-reduced-motion: reduce) { .sc-seal.working svg { animation: none; } }
	.sc-cert .addr { font-size: clamp(1.3rem, 5.4vw, var(--f3)); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere;
		margin: 2px 0 6px; }
	.sc-cert .meta { color: var(--ink-2); font-size: var(--f-1); margin-bottom: 18px; }

	/* the schedule: label and value rows */
	.sc-table, .sc-sched, .sc-progress b { font-variant-numeric: tabular-nums; }
	.sc-sched { width: 100%; border-collapse: collapse; }
	.sc-sched th, .sc-sched td { padding: 11px 0; border-bottom: 1px solid var(--rule-2); text-align: left; vertical-align: top; }
	.sc-sched th { width: 42%; color: var(--ink-2); font-weight: 500; padding-right: 16px; }
	.sc-sched td { font-weight: 600; }
	.sc-sched tr:last-child th, .sc-sched tr:last-child td { border-bottom: 0; }

	/* lists of records */
	.sc-table { width: 100%; border-collapse: collapse; }
	.sc-table th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: var(--f-1); padding: 8px 12px 8px 0;
		border-bottom: 1px solid var(--rule); white-space: nowrap; }
	.sc-table td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--rule-2); vertical-align: middle; }
	.sc-table tr:last-child td { border-bottom: 0; }
	.sc-table .num { text-align: right; padding-right: 0; white-space: nowrap; }
	.sc-scroll { overflow-x: auto; }
	.sc-table .when { white-space: nowrap; }
	@media (max-width: 600px) { .sc-table .wide { display: none; } }

	/* the stamp: a status, inked not filled */
	.sc-stamp { display: inline-block; padding: 1px 7px; border: 1.5px solid currentColor; border-radius: 3px;
		font-size: var(--f-1); font-weight: 700; line-height: 1.5; white-space: nowrap; color: var(--ink-2); }
	.sc-stamp.good { color: var(--seal); } .sc-stamp.warn { color: var(--amber); } .sc-stamp.bad { color: var(--red); }
	.sc-stamp.info { color: var(--ink); }

	/* what needs doing */
	.sc-todo { list-style: none; margin: 0; padding: 0; }
	.sc-todo li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0;
		border-bottom: 1px solid var(--rule-2); }
	.sc-todo li:last-child { border-bottom: 0; }
	.sc-todo b { display: block; }
	.sc-todo .sc-quiet { font-size: var(--f-1); }
	.sc-clear { padding: 14px 0; color: var(--ink-2); }

	/* a sequence: set-up steps, the ERP being built */
	.sc-steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
	.sc-steps li { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px;
		align-items: start; padding: 0 0 18px; }
	.sc-steps li::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 2px; width: 2px; background: var(--rule); }
	.sc-steps li:last-child::before { display: none; }
	.sc-steps li.done::before { background: var(--seal); }
	.sc-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--rule); background: var(--sheet);
		display: grid; place-items: center; font-size: var(--f-1); font-weight: 700; color: var(--ink-2); position: relative; }
	.sc-steps li.done .sc-dot { background: var(--seal); border-color: var(--seal); color: var(--sheet); }
	.sc-steps li.now .sc-dot { border-color: var(--ink); color: var(--ink); }
	.sc-steps li.failed .sc-dot { border-color: var(--red); color: var(--red); }
	.sc-steps li.skipped .sc-dot { border-color: var(--amber); color: var(--amber); }
	.sc-steps .t { padding-top: 3px; } .sc-steps .t b { font-weight: 600; }
	.sc-steps .t .sc-quiet { font-size: var(--f-1); display: block; }
	.sc-steps .a { display: flex; gap: 8px; padding-top: 1px; }
	.sc-progress { display: flex; align-items: baseline; gap: 12px; margin-bottom: 22px; }
	.sc-progress b { font-size: var(--f3); font-weight: 800; letter-spacing: -.02em; }
	.sc-bar { flex: 1; height: 6px; background: var(--rule-2); border-radius: 3px; overflow: hidden; align-self: center; }
	.sc-bar i { display: block; height: 100%; background: var(--seal); }

	/* controls */
	.sc-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 18px;
		border-radius: 6px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font: inherit;
		font-weight: 700; font-size: var(--f-1); text-decoration: none; cursor: pointer; white-space: nowrap; }
	.sc-btn:hover { background: var(--rule-2); }
	.sc-btn.go { background: var(--ink); color: var(--on-ink); }
	.sc-btn.go:hover { background: var(--ink); opacity: .9; }
	.sc-btn.big { min-height: 48px; padding: 10px 24px; font-size: var(--f0); }
	.sc-btn.sm { min-height: 32px; padding: 4px 12px; }
	.sc-btn.quiet { border-color: var(--rule); }
	.sc-btn.stop { border-color: var(--red); color: var(--red); }
	.sc-btn:disabled { opacity: .45; cursor: not-allowed; }
	.sc-acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
	.sc label.f { display: block; font-weight: 600; font-size: var(--f-1); margin: 16px 0 6px; }
	.sc label.f .sc-quiet { font-weight: 400; }
	.sc-in, .sc select.sc-in, .sc textarea.sc-in { width: 100%; min-height: 42px; padding: 8px 12px; font: inherit;
		color: var(--ink); background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 6px; }
	.sc textarea.sc-in { min-height: 76px; }
	.sc-in:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--rule-2); }
	.sc-inline { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
	.sc-inline > div { flex: 1 1 200px; }
	.sc-addr { display: flex; align-items: stretch; border: 1.5px solid var(--rule); border-radius: 6px; overflow: hidden; }
	.sc-addr:focus-within { border-color: var(--ink); box-shadow: 0 0 0 3px var(--rule-2); }
	.sc-addr input { border: 0; min-height: 42px; padding: 8px 12px; font: inherit; color: var(--ink); background: var(--sheet);
		flex: 1; min-width: 0; outline: none; }
	.sc-addr span { display: flex; align-items: center; padding: 0 12px; background: var(--rule-2); color: var(--ink-2); }
	.sc-hint { font-size: var(--f-1); min-height: 1.5em; margin-top: 6px; color: var(--ink-2); }
	.sc-hint.ok { color: var(--seal); } .sc-hint.no { color: var(--red); }
	.sc-check { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; }
	.sc-check input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--ink); }

	/* messages */
	.sc-note { padding: 12px 16px; border-left: 4px solid var(--ink); background: var(--rule-2); margin: 0 0 22px;
		border-radius: 0 4px 4px 0; }
	.sc-note.good { border-color: var(--seal); background: var(--seal-wash); }
	.sc-note.warn { border-color: var(--amber); background: var(--amber-wash); }
	.sc-note.bad { border-color: var(--red); background: var(--red-wash); }
	.sc-hide { display: none; }
	.sc details > summary { cursor: pointer; font-weight: 600; }
</style>
