# Checks that need no Frappe site: the rules' unit tests, lint, the generated files being up to date, every module
# imported against a stand-in for Frappe, the templates' Jinja syntax and the form scripts' syntax. Running on a site
# is not covered yet.
name: Stemic Cloud checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install ruff and Jinja
        run: pip install ruff jinja2

      - name: Unit tests (rules)
        working-directory: apps/stemic_cloud
        run: python -I -m unittest discover -s tests -v

      - name: Lint
        working-directory: apps/stemic_cloud
        run: ruff check stemic_cloud tools tests --select F,E9,B

      - name: Every module imports
        run: python -I apps/stemic_cloud/tests/standin/import_check.py

      - name: Templates parse
        working-directory: apps/stemic_cloud
        run: |
          python -I -c "
          import glob, sys, jinja2
          env = jinja2.Environment(extensions=['jinja2.ext.do'])
          bad = []
          for f in glob.glob('stemic_cloud/**/*.html', recursive=True):
              try:
                  env.parse(open(f).read())
              except jinja2.TemplateSyntaxError as e:
                  bad.append(f'{f}:{e.lineno}: {e.message}')
          print('\n'.join(bad) or 'templates parse')
          sys.exit(1 if bad else 0)"

      - name: Generated files are up to date
        run: |
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/apps/stemic_cloud/tools/build_doctypes.py"
          python -I "$GITHUB_WORKSPACE/apps/stemic_cloud/tools/build_navigation.py"
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code apps || (echo "Run the generators in apps/stemic_cloud/tools and commit what they write." && exit 1)
          test -z "$(git status --porcelain apps)"

      - name: JavaScript syntax
        run: for f in apps/stemic_cloud/stemic_cloud/public/js/*.js; do node --check "$f" || exit 1; done
